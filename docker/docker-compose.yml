services:
  pgtt-train:
    build:
      context: .
      dockerfile: Dockerfile
    image: go2-stair-climber:latest
    container_name: pgtt-train
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY:-:0}
      - JAX_PLATFORMS=cuda
      - XLA_PYTHON_CLIENT_PREALLOCATE=false
      - XLA_PYTHON_CLIENT_MEM_FRACTION=0.7
    volumes:
      - ../:/workspace/go2-stair-climber
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${HOME}/.Xauthority:/root/.Xauthority:ro
    network_mode: host
    stdin_open: true
    tty: true
    working_dir: /workspace/go2-stair-climber

  ros2-stack:
    image: osrf/ros:humble-desktop-full
    container_name: ros2-stack
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - DISPLAY=${DISPLAY:-:0}
      - ROS_DOMAIN_ID=42
    volumes:
      - ../ros2_ws:/workspace/ros2_ws
      - /tmp/.X11-unix:/tmp/.X11-unix
    network_mode: host
    stdin_open: true
    tty: true
    working_dir: /workspace/ros2_ws
    command: bash
