stair_detector_node:
  ros__parameters:
    # Region of Interest (LiDAR frame)
    forward_min: 0.3
    forward_max: 5.0
    side_range: 2.5
    z_min: -0.5
    z_max: 2.0
    
    # Person exclusion
    person_exclusion_radius: 0.5     # 50cm around person
    person_timeout: 1.0               # If /person_tracked older, ignore
    
    # KDE bandwidth (smaller = sharper peaks)
    kde_bandwidth: 0.02
    
    # Peak detection (relaxed for real stairs)
    peak_height_ratio: 0.1           # 0.1 (lenient) ~ 0.3 (strict)
    peak_min_distance: 0.05          # 5cm minimum between peaks
    
    # Step refinement
    z_slice_thickness: 0.03          # 3cm around peak
    min_points_per_step: 20
    
    # Stair validation (relaxed)
    min_steps: 3
    step_height_min: 0.05            # Actual sim stairs seem 6-9cm
    step_height_max: 0.30
    height_std_ratio: 0.5            # More tolerant of irregular steps
    
    # XY progression (relaxed)
    xy_min_distance: 0.05
    xy_max_distance: 1.20